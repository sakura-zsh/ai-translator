name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libraries for offscreen Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install project + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff
        run: ruff check app tests

      - name: Tests (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: mypy (non-blocking, observe first)
        continue-on-error: true
        run: mypy app

  windows-build:
    # Smoke-build the PyInstaller bundle on every push to keep §packaging
    # from rotting. Not uploaded; full release builds stay local.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build (onedir)
        run: >
          python -m PyInstaller --noconfirm
          --distpath packaging\windows\dist
          --workpath packaging\windows\build
          packaging\windows\ai-translator.spec
