name: CI

on:
  push:
    branches: [main, feat/tauri-rewrite]
  pull_request:

jobs:
  rust-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit & Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf pkg-config libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Frontend install, typecheck, test, build
        run: |
          pnpm install --allow-build esbuild
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Rust tests & clippy
        run: |
          cargo test --workspace
          cargo clippy --workspace -- -D warnings

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build Windows Tauri & CLI
        run: |
          pnpm install --allow-build esbuild
          pnpm build
          cargo check --workspace
          cargo build --release -p ai-translator-cli
