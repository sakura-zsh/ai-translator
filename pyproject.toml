[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-translator"
description = "Lightweight cross-platform AI translator (Linux/Wayland, Windows)"
readme = "README.md"
requires-python = ">=3.11"
# Single source of truth: app/__init__.py
dynamic = ["version"]
dependencies = [
    # App uses QtCore/QtGui/QtWidgets/QtNetwork only — Essentials covers all.
    # The full "PySide6" metapackage drags in Addons (WebEngine, 3D, …),
    # which bloats pip installs and PyInstaller builds by ~1 GB.
    "PySide6-Essentials>=6.6",
    "httpx>=0.27",
    "Pillow>=10.0",
]

[project.scripts]
ai-translator = "app.main:main"
ai-translator-cli = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ui/themes/*.qss"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]
ignore = [
    "E501",  # long lines are fine in prompts / UI strings
]

[tool.ruff.lint.per-file-ignores]
# Qt event handlers intentionally override camelCase names
"app/ui/*" = ["N802"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
exclude = ["packaging/"]
